name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release, MinGW GCC)
        run: cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_C_COMPILER=gcc -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -B build

      - name: Upload portable archive
        uses: actions/upload-artifact@v4
        with:
          name: Codons-windows-x64
          path: build/Codons-*-windows-x64.zip
          if-no-files-found: error
